# fi

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix
# 0 is too far from ` ;)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#{S:#[range=session|#{session_id}]#[fg=colour250] #{session_name} #[norange],#[range=session|#{session_id}]#[fg=colour255,bold] #{session_name} #[norange]}'
set -g status-right-length 80
set -g status-left-length 20
setw -g mode-keys vi

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
set -g window-status-activity-style "fg=colour215,underscore"
set -g window-status-bell-style     "fg=colour203,underscore,bold"

set-option -g history-limit 50000
set -g default-terminal tmux-256color
set -g status-keys vi
set -s extended-keys on
set -g set-clipboard on
set -g allow-passthrough all

# Enable mouse control (clickable windows, panes, resizable panes)
setw -g monitor-activity on
set -g mouse on

# No delay for escape key press
set -sg escape-time 0

#bind-key v split-window -h
#bind-key s split-window -v
#
bind-key J split-window -h -c '#{pane_current_path}'
bind-key H split-window -v -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'
bind-key S command-prompt -p "session name:" "new-session -s '%%' -c '#{pane_current_path]'"
bind-key h previous-window
bind-key l next-window
bind-key k switch-client -p
bind-key j switch-client -n

#bind-key J resize-pane -D 5
#bind-key K resize-pane -U 5
#bind-key H resize-pane -L 5
#bind-key L resize-pane -R 5
#
#bind-key M-j resize-pane -D
#bind-key M-k resize-pane -U
#bind-key M-h resize-pane -L
#bind-key M-l resize-pane -R
#
# Vim style pane selection
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R
#
## Use Alt-vim keys without prefix key to switch panes
#bind -n M-h select-pane -L
#bind -n M-j select-pane -D 
#bind -n M-k select-pane -U
#bind -n M-l select-pane -R
#
## Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
#
## Shift arrow to switch windows
#bind -n S-Left  previous-window
#bind -n S-Right next-window

# session persistence — to install clone both repos then source this config
# git clone https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect
# git clone https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum
# restore is done by the shell autostart (attach, or restore into a fresh server),
# not by continuum: continuum restores after the client already created a new session
set -g @continuum-restore 'off'
set -g @continuum-save-interval '1'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
# after killing a session, prefix C-s saves right away instead of waiting for the autosave
 
## Reload tmux config
bind r source-file ~/.tmux.conf
